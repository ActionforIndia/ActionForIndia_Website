<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Mentors — Action For India</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="shared-components.css" />
  <style>
    .mentor-card img { width:100px; height:100px; border-radius:50%; object-fit:cover; margin:0 auto 12px; display:block; background:var(--color-primary-lighter); }
    .directory-search { width:100%; max-width:400px; padding:12px 16px; border:0.8px solid var(--color-primary-light); border-radius:8px; margin-bottom:16px; }
    .directory-count { font-size:14px; color:var(--color-text-muted); margin-bottom:8px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo"><div class="navbar__logo-icon">AFI</div><span class="navbar__logo-text">Action For India</span></a>
      <div class="navbar__nav" id="main-nav"></div>
      <button class="navbar__cta" id="donate-btn">Donate</button>
    </div>
  </nav>

  <section class="page-hero">
    <div class="page-hero__inner">
      <span class="page-hero__label">Get to Know Us</span>
      <h1 class="page-hero__title">Our <em>Mentors</em></h1>
      <p class="page-hero__desc" id="page-desc"></p>
    </div>
  </section>

  <section class="page-section page-section--cream">
    <div class="page-section__inner">
      <input type="search" class="directory-search" id="mentor-search" placeholder="Search mentors by name, title, or location..." />
      <p class="directory-count" id="mentor-count"></p>
      <div class="card-grid" id="mentors-grid"></div>
      <p style="margin-top:32px;text-align:center">
        <a href="#" class="btn btn--primary" id="mentor-apply-btn">Become a Mentor</a>
      </p>
    </div>
  </section>

  <footer class="footer"><div class="footer__inner">
    <div class="footer__columns">
      <div class="footer__brand"><div class="footer__brand-logo"><div class="footer__brand-icon">AFI</div><span class="footer__brand-name">Action For India</span></div><p class="footer__brand-desc"></p></div>
      <div><div class="footer__col-title">Organization</div><a href="entrepreneurs.html" class="footer__col-link">Social Entrepreneurs</a><a href="about.html" class="footer__col-link" id="footer-about">About Us</a></div>
      <div><div class="footer__col-title">Contact</div><a href="mailto:info@actionforindia.org" class="footer__col-link" id="footer-email">info@actionforindia.org</a></div>
    </div>
    <div class="footer__bottom"><div class="footer__copyright">© 2026 Action For India. All rights reserved.</div></div>
  </div></footer>

  <script src="scraped-data-bundle.js"></script>
  <script src="site-data.js"></script>
  <script src="shared-layout.js"></script>
  <script src="site-common.js"></script>
  <script src="page-shell.js"></script>
  <script src="mentors.js"></script>
</body>
</html>

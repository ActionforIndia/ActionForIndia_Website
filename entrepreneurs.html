<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Social Entrepreneurs — Action For India</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="shared-components.css" />
  <style>
    .directory-filters { display:flex; flex-wrap:wrap; gap:8px; margin:24px 0; }
    .directory-filters button { padding:8px 16px; border:0.8px solid var(--color-primary-light); border-radius:999px; background:var(--color-white); cursor:pointer; font-size:13px; }
    .directory-filters button.active { background:var(--color-primary); color:white; border-color:var(--color-primary); }
    .directory-search { width:100%; max-width:400px; padding:12px 16px; border:0.8px solid var(--color-primary-light); border-radius:8px; margin-bottom:16px; }
    .se-card { text-align:center; }
    .se-card img { width:120px; height:80px; object-fit:contain; margin:0 auto 12px; }
    .se-card__founder { font-size:13px; color:var(--color-text-muted); margin-top:6px; }
    .se-card__links { margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .se-card__links a { font-size:12px; color:var(--color-primary); }
    .directory-count { font-size:14px; color:var(--color-text-muted); margin-bottom:8px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo"><div class="navbar__logo-icon">AFI</div><span class="navbar__logo-text">Action For India</span></a>
      <div class="navbar__nav" id="main-nav"></div>
      <button class="navbar__cta" id="donate-btn">Donate</button>
    </div>
  </nav>

  <section class="page-hero">
    <div class="page-hero__inner">
      <span class="page-hero__label">Get to Know Us</span>
      <h1 class="page-hero__title">Our <em>Social Entrepreneurs</em></h1>
      <p class="page-hero__desc" id="page-desc"></p>
    </div>
  </section>

  <section class="page-section page-section--cream">
    <div class="page-section__inner">
      <input type="search" class="directory-search" id="se-search" placeholder="Search by venture, founder, or sector..." />
      <div class="directory-filters" id="se-filters"></div>
      <p class="directory-count" id="se-count"></p>
      <div class="card-grid" id="entrepreneurs-grid"></div>
      <p style="margin-top:32px;text-align:center">
        <a href="https://actionforindia.accubate.app/ext/form/1673/1/apply" class="btn btn--primary" target="_blank" rel="noopener noreferrer">Apply as a Social Entrepreneur</a>
      </p>
    </div>
  </section>

  <footer class="footer"><div class="footer__inner">
    <div class="footer__columns">
      <div class="footer__brand"><div class="footer__brand-logo"><div class="footer__brand-icon">AFI</div><span class="footer__brand-name">Action For India</span></div><p class="footer__brand-desc"></p></div>
      <div><div class="footer__col-title">Organization</div><a href="about.html" class="footer__col-link" id="footer-about">About Us</a><a href="mentors.html" class="footer__col-link">Our Mentors</a><a href="forum.html" class="footer__col-link" id="footer-forum">Annual Forum</a></div>
      <div><div class="footer__col-title">Contact</div><a href="mailto:info@actionforindia.org" class="footer__col-link" id="footer-email">info@actionforindia.org</a></div>
    </div>
    <div class="footer__bottom"><div class="footer__copyright">© 2026 Action For India. All rights reserved.</div><div class="footer__social"><a href="#" class="footer__social-link" id="social-linkedin">LinkedIn</a></div></div>
  </div></footer>

  <script src="site-data.js"></script>
  <script src="shared-layout.js"></script>
  <script src="site-common.js"></script>
  <script src="page-shell.js"></script>
  <script src="entrepreneurs.js"></script>
</body>
</html>
